name: Daily A-share opening auction

on:
  workflow_dispatch:
  schedule:
    # UTC. Four starts reduce GitHub scheduler jitter; the collector accepts only 09:26:05–09:28:59 China time.
    - cron: "10,15,20,25 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-a-share-auction
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and verify collector
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pytest -q

      - name: Collect verified 09:25 final auction
        run: python -m auction_collector.cloud_run --root .

      - name: Commit durable history and latest pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data database latest
          if git diff --cached --quiet; then
            echo "No new verified report to publish"
            exit 0
          fi
          git commit -m "data: publish $(date +%F) opening auction"
          git push
